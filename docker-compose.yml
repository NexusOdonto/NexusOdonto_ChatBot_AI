  qdrant-db:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant_vector
    ports:
      - "6333:6333"
    networks:
      - odontologia_network

  agente-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente_python
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant-db:6333
      - EVOLUTION_API_URL=http://evolution-whatsapp:8080
      - DOTNET_API_URL=http://backend-api:8080/api/v1
    depends_on:
      - qdrant-db
    networks:
      - odontologia_network

networks:
  odontologia_network:
    driver: bridge