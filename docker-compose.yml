services:


  evolution-whatsapp:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_whatsapp
    environment:
      - AUTHENTICATION_API_KEY=CLAVE_SECRETA_ODONTO_2026
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution_user:evolution_password@evolution-postgres:5432/evolution
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - REDIS_ENABLED=false
      - WEBSOCKET_ENABLED=false
      # Instance webhook only — avoid duplicate deliveries via global + instance webhooks
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=false
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      # URL interna de la API (ayuda a Baileys a estabilizar el handshake)
      - SERVER_URL=http://evolution-whatsapp:8080
      - QRCODE_LIMIT=30
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Fuerza a Baileys a preferir JIDs estándar @s.whatsapp.net sobre LIDs cuando sea posible.
      # Esto reduce la frecuencia de llegada de remoteJid con @lid, minimizando colisiones de identidad.
      - WPP_LID_MODE=false
      # Versión de WhatsApp Web que emula Baileys (sin sufijo -alpha)
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1047303469
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome
    depends_on:
      - evolution-postgres
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - odontologia_network

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    environment:
      - POSTGRES_USER=evolution_user
      - POSTGRES_PASSWORD=evolution_password
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - odontologia_network

  qdrant-db:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant_vector
    networks:
      - odontologia_network

  bot-memory-db:
    image: postgres:15-alpine
    container_name: bot_memory_postgres
    environment:
      - POSTGRES_USER=bot_user
      - POSTGRES_PASSWORD=bot_password
      - POSTGRES_DB=bot_memory
    volumes:
      - bot_memory_data:/var/lib/postgresql/data
    networks:
      - odontologia_network

  agente-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente_python
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-8}
      - GRAPH_TIMEOUT_SECONDS=${GRAPH_TIMEOUT_SECONDS:-300}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - QDRANT_URL=http://qdrant-db:6333
      - EVOLUTION_API_URL=http://evolution-whatsapp:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-CLAVE_SECRETA_ODONTO_2026}
      - DOTNET_API_URL=${DOTNET_DOCKER_API_URL:-http://odontologia_api:8080/api/v1}
      - DOTNET_AUTH_LOGIN=${DOTNET_AUTH_LOGIN:-}
      - DOTNET_AUTH_PASSWORD=${DOTNET_AUTH_PASSWORD:-}
      - POSTGRES_CHECKPOINT_URL=postgresql://bot_user:bot_password@bot-memory-db:5432/bot_memory
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_SIGNATURE_HEADER=${WEBHOOK_SIGNATURE_HEADER:-x-webhook-signature}
      - AGENT_INTERNAL_SECRET=${AGENT_INTERNAL_SECRET:-TOKEN_SECRETO_INTERNO_NET_2026}
      - EVOLUTION_SEND_DELAY_MS=${EVOLUTION_SEND_DELAY_MS:-400}
    depends_on:
      - qdrant-db
      - bot-memory-db
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - odontologia_network

volumes:
  evolution_instances:
  evolution_postgres_data:
  bot_memory_data:

networks:
  odontologia_network:
    name: odontologia_network
    driver: bridge
